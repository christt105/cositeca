name: Añadir cosita
description: Añade una película o serie, o una versión nueva de una que ya existe
title: "[add] "
labels: ["entry", "add"]
body:
  - type: input
    id: tmdb
    attributes:
      label: URL de TMDB o id de IMDB
      description: URL de TMDB de la película o serie, o id de IMDB tt...
      placeholder: https://www.themoviedb.org/movie/550-fight-club
    validations:
      required: true
  - type: input
    id: quality
    attributes:
      label: Calidad
      description: "1080p o 4K"
      placeholder: 1080p
    validations:
      required: true
  - type: input
    id: season
    attributes:
      label: Temporada
      description: "Solo series: número de temporada, 0 para especiales, all para la serie completa"
    validations:
      required: false
  - type: input
    id: audio
    attributes:
      label: Audio
      description: "Opcional, idiomas de audio separados por comas: Castellano, Latino, Inglés, Japonés, Francés, Catalán, VO"
      placeholder: Castellano, Inglés
    validations:
      required: false
  - type: input
    id: subs
    attributes:
      label: Subtítulos
      description: "Opcional, idiomas de subtítulos separados por comas: Castellano, Latino, Inglés, Japonés, Francés, Catalán, VO, Forzados"
      placeholder: Castellano, Forzados
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Etiquetas
      description: Opcional, separadas por comas
    validations:
      required: false
  - type: input
    id: poster
    attributes:
      label: Portada
      description: Opcional, URL de una portada distinta a la de TMDB
      placeholder: https://image.tmdb.org/t/p/w342/....jpg
    validations:
      required: false
  - type: input
    id: link
    attributes:
      label: Link de Telegram
      description: Link del mensaje de Telegram, copiado con Copiar enlace
      placeholder: https://t.me/c/2229558644/12345
    validations:
      required: true
