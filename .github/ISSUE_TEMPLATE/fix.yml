name: Corregir o borrar un link
description: Corrige o borra un link que ya existe
title: "[fix] "
labels: ["entry", "fix"]
body:
  - type: input
    id: tmdb
    attributes:
      label: URL de TMDB o id de IMDB
      description: URL de TMDB de la película o serie, o id de IMDB tt...
      placeholder: https://www.themoviedb.org/movie/550-fight-club
    validations:
      required: true
  - type: input
    id: old_link
    attributes:
      label: Link actual
      description: El link de Telegram que hay que corregir o borrar
      placeholder: https://t.me/c/2229558644/12345
    validations:
      required: true
  - type: input
    id: new_link
    attributes:
      label: Link nuevo
      description: Déjalo vacío para borrar el link
      placeholder: https://t.me/c/2229558644/12345
    validations:
      required: false
  - type: dropdown
    id: quality
    attributes:
      label: Calidad
      description: Opcional, solo si quieres cambiar la calidad
      options:
        - 1080p
        - 4K
    validations:
      required: false
  - type: input
    id: season
    attributes:
      label: Temporada
      description: "Opcional, solo series: número de temporada, 0 para especiales, all para la serie completa"
    validations:
      required: false
