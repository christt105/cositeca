name: Corregir o borrar un link
description: Corrige o borra un link que ya existe
title: "[fix] "
labels: ["entry", "fix"]
body:
  - type: input
    id: tmdb
    attributes:
      label: URL de TMDB o id de IMDB
      description: URL de TMDB de la película o serie, o id de IMDB tt...
      placeholder: https://www.themoviedb.org/movie/550-fight-club
    validations:
      required: true
  - type: input
    id: old_link
    attributes:
      label: Link actual
      description: El link de Telegram que hay que corregir o borrar
      placeholder: https://t.me/c/2229558644/12345
    validations:
      required: true
  - type: input
    id: new_link
    attributes:
      label: Link nuevo
      description: Déjalo vacío para borrar el link
      placeholder: https://t.me/c/2229558644/12345
    validations:
      required: false
  - type: input
    id: quality
    attributes:
      label: Calidad
      description: "Opcional, solo si quieres cambiar la calidad: 1080p o 4K"
      placeholder: 1080p
    validations:
      required: false
  - type: input
    id: audio
    attributes:
      label: Audio
      description: "Opcional, solo si quieres cambiar el audio, separado por comas (\"-\" para quitarlo): Castellano, Latino, Inglés, Japonés, Francés, Catalán, VO"
      placeholder: Castellano, Inglés
    validations:
      required: false
  - type: input
    id: subs
    attributes:
      label: Subtítulos
      description: "Opcional, solo si quieres cambiar los subtítulos, separado por comas (\"-\" para quitarlos): Castellano, Latino, Inglés, Japonés, Francés, Catalán, VO, Forzados"
      placeholder: Castellano, Forzados
    validations:
      required: false
  - type: input
    id: new_audio_language
    attributes:
      label: Nuevo idioma (audio)
      description: Opcional, solo si el audio está en un idioma que no aparece en la lista de arriba. Se añade a la lista para todo el mundo.
      placeholder: Portugués
    validations:
      required: false
  - type: input
    id: new_subs_language
    attributes:
      label: Nuevo idioma (subtítulos)
      description: Opcional, solo si los subtítulos están en un idioma que no aparece en la lista de arriba. Se añade a la lista para todo el mundo.
      placeholder: Coreano
    validations:
      required: false
  - type: input
    id: season
    attributes:
      label: Temporada
      description: "Opcional, solo series: número de temporada, 0 para especiales, all para la serie completa"
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Etiquetas
      description: Opcional, solo si quieres cambiar las etiquetas (separadas por comas, "-" para quitarlas todas)
    validations:
      required: false
