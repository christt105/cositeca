<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cositeca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Cositeca</h1>
    <input id="search" class="search" type="search" placeholder="Busca por título, id de TMDB o IMDB">
    <div class="filters" id="filters">
      <button class="filter-btn is-active" data-filter="all">Todo</button>
      <button class="filter-btn" data-filter="movie">Películas</button>
      <button class="filter-btn" data-filter="series">Series</button>
    </div>
    <a class="btn btn--add" id="add-btn" href="#" target="_blank" rel="noopener">Añadir</a>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">
      <p>No está en la Cositeca. ¿La añades?</p>
      <a class="btn btn--add" id="empty-add-btn" href="#" target="_blank" rel="noopener">Añadir</a>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal__backdrop" id="modal-backdrop"></div>
    <div class="modal__panel">
      <button class="modal__close" id="modal-close" aria-label="Cerrar">&times;</button>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <footer class="footer">
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    <p><a href="https://github.com/christt105/cositeca/blob/main/GUIA.md" target="_blank" rel="noopener">Cómo añadir una cosita</a></p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
